<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA Group Therapy Directory – Loma Linda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #1a1a2e; min-height: 100vh; }
  header { background: #1a3a5c; color: white; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.75rem; }
  header h1 { font-size: 1.4rem; font-weight: 600; }
  header p { font-size: 0.85rem; opacity: 0.75; margin-top: 0.25rem; }
  .header-left { display: flex; flex-direction: column; }
  .last-change { text-align: right; font-size: 0.75rem; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 0.45rem 0.85rem; line-height: 1.5; flex-shrink: 0; }
  .last-change .lc-label { opacity: 0.7; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .last-change .lc-value { font-weight: 600; opacity: 1; }
  .meta-bar { background: #1e4976; color: white; display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 0.75rem 2rem; font-size: 0.8rem; }
  .meta-bar span { opacity: 0.85; } .meta-bar strong { opacity: 1; }
  .toolbar { background: white; border-bottom: 1px solid #dde3ec; padding: 0.65rem 2rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .toolbar-toggle-btn { display: flex; align-items: center; gap: 0.4rem; border: 1px solid #c8d0de; background: white; border-radius: 20px; padding: 0.3rem 0.9rem; font-size: 0.78rem; cursor: pointer; color: #333; transition: all 0.15s; white-space: nowrap; }
  .toolbar-toggle-btn:hover { border-color: #1a3a5c; color: #1a3a5c; }
  .toolbar-toggle-btn.has-active { background: #1a3a5c; color: white; border-color: #1a3a5c; }
  .active-chip { display: inline-flex; align-items: center; gap: 0.25rem; background: #e8edf4; color: #1a3a5c; border-radius: 20px; padding: 0.2rem 0.6rem; font-size: 0.72rem; font-weight: 600; }
  .active-chip button { background: none; border: none; cursor: pointer; color: #1a3a5c; font-size: 13px; line-height: 1; padding: 0; margin-left: 0.1rem; opacity: 0.6; }
  .active-chip button:hover { opacity: 1; }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap input { border: 1px solid #c8d0de; border-radius: 20px; padding: 0.28rem 0.8rem 0.28rem 2rem; font-size: 0.78rem; width: 190px; outline: none; }
  .search-wrap input:focus { border-color: #1a3a5c; }
  .search-wrap i { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); color: #888; font-size: 14px; }
  .filter-panel { display: none; background: white; border-bottom: 1px solid #dde3ec; padding: 1rem 2rem; flex-direction: column; gap: 0.75rem; }
  .filter-panel.open { display: flex; }
  .filter-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .filter-group-label { font-size: 0.74rem; font-weight: 700; color: #555; width: 68px; flex-shrink: 0; }
  .filter-btn { border: 1px solid #c8d0de; background: white; border-radius: 20px; padding: 0.24rem 0.75rem; font-size: 0.74rem; cursor: pointer; color: #333; transition: all 0.15s; white-space: nowrap; }
  .filter-btn:hover { border-color: #1a3a5c; color: #1a3a5c; }
  .filter-btn.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }
  .filter-btn.virtual.active { background: #0f6e56; border-color: #0f6e56; }
  .filter-btn.inperson.active { background: #533ab7; border-color: #533ab7; }
  .filter-panel-footer { display: flex; justify-content: flex-end; padding-top: 0.25rem; border-top: 1px solid #eef0f5; }
  .clear-all-btn { font-size: 0.74rem; color: #c0392b; background: none; border: none; cursor: pointer; padding: 0.2rem 0.4rem; }
  .clear-all-btn:hover { text-decoration: underline; }
  .summary-bar { display: flex; gap: 1rem; padding: 0.85rem 2rem; flex-wrap: wrap; }
  .stat-card { background: white; border: 1px solid #dde3ec; border-radius: 10px; padding: 0.6rem 1.1rem; min-width: 110px; text-align: center; }
  .stat-card .num { font-size: 1.4rem; font-weight: 700; color: #1a3a5c; }
  .stat-card .lbl { font-size: 0.7rem; color: #666; margin-top: 0.1rem; }
  .hint { padding: 0 2rem 0.5rem; font-size: 0.76rem; color: #888; display: flex; align-items: center; gap: 0.35rem; }
  .group-list { display: flex; flex-direction: column; gap: 0.6rem; padding: 0 2rem 5rem; }
  .group-card { background: white; border: 1px solid #dde3ec; border-radius: 12px; overflow: hidden; transition: box-shadow 0.15s, border-color 0.15s; cursor: pointer; }
  .group-card:hover { border-color: #a0b4cc; box-shadow: 0 2px 10px rgba(26,58,92,0.08); }
  .group-card.expanded { border-color: #1a3a5c; box-shadow: 0 4px 18px rgba(26,58,92,0.13); cursor: default; }
  .card-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.1rem; user-select: none; }
  .card-row-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }
  .chevron { color: #aaa; font-size: 16px; flex-shrink: 0; transition: transform 0.2s; }
  .group-card.expanded .chevron { transform: rotate(180deg); color: #1a3a5c; }
  .row-name { font-size: 0.9rem; font-weight: 600; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 0.75rem; color: #666; white-space: nowrap; flex-shrink: 0; }
  .row-badges { display: flex; gap: 0.35rem; flex-shrink: 0; flex-wrap: wrap; }
  .type-badge { font-size: 0.66rem; background: #e8edf4; color: #1a3a5c; border-radius: 20px; padding: 0.15rem 0.55rem; white-space: nowrap; }
  .loc-badge { font-size: 0.66rem; background: #f0e8fb; color: #5a2d82; border-radius: 20px; padding: 0.15rem 0.55rem; white-space: nowrap; }
  .modality-badge { font-size: 0.66rem; border-radius: 20px; padding: 0.15rem 0.55rem; white-space: nowrap; }
  .modality-badge.Virtual { background: #9fe1cb; color: #04342c; }
  .modality-badge.In-Person { background: #cecbf6; color: #26215c; }
  .status-badge { font-size: 0.66rem; border-radius: 20px; padding: 0.15rem 0.6rem; font-weight: 600; white-space: nowrap; }
  .status-inactive { background: #f1efea; color: #5f5e5a; border: 1px solid #d3d1c7; }
  .status-full { background: #fde8d5; color: #7a3a00; border: 1px solid #f5c4a0; }
  .group-card.inactive { opacity: 0.6; }
  .group-card.inactive .card-row { background: #fafafa; }
  .card-detail { display: none; border-top: 1px solid #e5eaf2; }
  .group-card.expanded .card-detail { display: block; }
  .detail-header { background: #1a3a5c; color: white; padding: 0.85rem 1.1rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  .detail-header h3 { font-size: 1rem; font-weight: 600; line-height: 1.3; }
  .detail-header-badges { display: flex; flex-direction: column; gap: 0.3rem; align-items: flex-end; flex-shrink: 0; }
  .detail-body { padding: 1rem 1.1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .info-row { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.8rem; color: #333; padding: 0.28rem 0; border-bottom: 1px solid #f0f2f6; }
  .info-row:last-child { border-bottom: none; }
  .info-row i { color: #1a3a5c; font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .info-label { color: #777; width: 115px; flex-shrink: 0; }
  .info-val { color: #1a1a2e; font-weight: 500; }
  .info-row.lastupdated-row { grid-column: 1/-1; background: #f8fbff; border-radius: 6px; margin-top: 0.15rem; padding: 0.4rem 0.5rem; border-bottom: none; }
  .info-row.lastupdated-row .info-val { color: #1a3a5c; font-weight: 600; }
  .eligibility-section { border-top: 1px solid #eef0f5; background: #f8fbff; padding: 0.75rem 1.1rem; font-size: 0.8rem; color: #444; line-height: 1.6; }
  .eligibility-section strong { display: block; font-size: 0.72rem; color: #1a3a5c; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
  .detail-footer { background: #f8f9fb; border-top: 1px solid #eef0f5; padding: 0.6rem 1.1rem; display: flex; justify-content: space-between; align-items: center; }
  .referral-pill { font-size: 0.7rem; border-radius: 20px; padding: 0.2rem 0.65rem; font-weight: 600; }
  .referral-consult { background: #e0ecf9; color: #1a3a5c; }
  .referral-self { background: #e2f5ec; color: #1a5c3a; }
  .referral-pcmm { background: #fdf0d5; color: #7a5200; }
  .footer-actions { display: flex; gap: 0.5rem; }
  .icon-btn { border: none; background: none; cursor: pointer; font-size: 15px; padding: 0.25rem 0.4rem; border-radius: 6px; line-height: 1; }
  .icon-btn.edit { color: #1a3a5c; background: #e8edf4; }
  .icon-btn.del { color: #c0392b; background: #fdecea; }
  .icon-btn.inactivate { color: #7a5200; background: #fdf0d5; }
  .icon-btn.activate { color: #1a5c3a; background: #e2f5ec; }
  .icon-btn.full-btn { color: #7a3a00; background: #fde8d5; }
  .icon-btn.unfull-btn { color: #1a3a5c; background: #e8edf4; }
  .icon-btn:hover { opacity: 0.75; }
  .empty-state { text-align: center; padding: 3rem; color: #888; font-size: 0.9rem; }
  .empty-state i { font-size: 2.5rem; color: #ccc; display: block; margin-bottom: 0.75rem; }
  .add-btn { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1a3a5c; color: white; border: none; border-radius: 50px; padding: 0.65rem 1.25rem; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; box-shadow: 0 4px 14px rgba(26,58,92,0.3); z-index: 100; }
  .add-btn:hover { background: #1e4976; }
  .export-btn { position: fixed; bottom: 1.5rem; left: 1.5rem; background: white; color: #1a3a5c; border: 1px solid #1a3a5c; border-radius: 50px; padding: 0.65rem 1.25rem; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; box-shadow: 0 4px 14px rgba(26,58,92,0.15); z-index: 100; }
  .export-btn:hover { background: #f0f5fb; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 14px; width: 100%; max-width: 640px; padding: 1.5rem; }
  .modal h2 { font-size: 1.1rem; font-weight: 600; color: #1a3a5c; margin-bottom: 1.2rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-grid .full { grid-column: 1/-1; }
  .form-group label { display: block; font-size: 0.75rem; color: #555; margin-bottom: 0.25rem; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; border: 1px solid #c8d0de; border-radius: 8px; padding: 0.4rem 0.7rem; font-size: 0.82rem; outline: none; background: #fafbfc; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a3a5c; }
  .form-group textarea { height: 64px; resize: vertical; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.2rem; }
  .btn-cancel { border: 1px solid #c8d0de; background: white; border-radius: 8px; padding: 0.45rem 1rem; font-size: 0.82rem; cursor: pointer; color: #333; }
  .btn-save { background: #1a3a5c; color: white; border: none; border-radius: 8px; padding: 0.45rem 1.1rem; font-size: 0.82rem; cursor: pointer; font-weight: 600; }
  .btn-save:hover { background: #1e4976; }
  @media (max-width: 600px) {
    .group-list { padding: 0 1rem 5rem; }
    .toolbar, .meta-bar, .summary-bar, .hint { padding-left: 1rem; padding-right: 1rem; }
    .detail-body { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: 1; }
    .search-wrap { margin-left: 0; width: 100%; }
    .search-wrap input { width: 100%; }
    .row-meta, .row-badges { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1><i class="ti ti-shield-heart" style="margin-right:0.4rem;vertical-align:-2px"></i>VA Group Therapy Directory</h1>
    <p>Provider Reference &amp; Referral Guide</p>
  </div>
  <div class="last-change" id="lastChangeBox">
    <div class="lc-label">Last Directory Change</div>
    <div class="lc-value" id="lastChangeVal">No changes yet</div>
  </div>
</header>

<div class="meta-bar">
  <span><strong>Facility:</strong> Loma Linda VAMC</span>
  <span><strong>Last Updated:</strong> <span id="lastUpdated">—</span></span>
  <span><strong>Directory Contact:</strong> Mental Health Administration</span>
</div>

<div class="toolbar">
  <button class="toolbar-toggle-btn" id="filterToggleBtn" onclick="toggleFilterPanel()">
    <i class="ti ti-adjustments-horizontal"></i> Filter &amp; Sort
  </button>
  <div class="chips-wrap" id="activeChips"></div>
  <div class="sort-wrap" style="display:flex;align-items:center;gap:0.4rem;">
    <label style="font-size:0.78rem;font-weight:600;color:#555;white-space:nowrap;">Sort:</label>
    <select id="sortSelect" onchange="setSortBy(this.value)" style="border:1px solid #c8d0de;border-radius:20px;padding:0.28rem 0.8rem;font-size:0.78rem;outline:none;background:white;cursor:pointer;color:#333;">
      <option value="default">Default (Day/Time)</option>
      <option value="updated-desc">Last Updated (Newest)</option>
      <option value="updated-asc">Last Updated (Oldest)</option>
      <option value="name">Name (A–Z)</option>
    </select>
  </div>
  <div class="search-wrap">
    <i class="ti ti-search"></i>
    <input type="text" placeholder="Search groups…" oninput="searchGroups(this.value)">
  </div>
</div>

<div class="filter-panel" id="filterPanel">
  <div class="filter-group">
    <span class="filter-group-label">Day</span>
    <button class="filter-btn active" data-group="day" data-val="All" onclick="setFilter('day','All',this)">All</button>
    <button class="filter-btn" data-group="day" data-val="Monday" onclick="setFilter('day','Monday',this)">Mon</button>
    <button class="filter-btn" data-group="day" data-val="Tuesday" onclick="setFilter('day','Tuesday',this)">Tue</button>
    <button class="filter-btn" data-group="day" data-val="Wednesday" onclick="setFilter('day','Wednesday',this)">Wed</button>
    <button class="filter-btn" data-group="day" data-val="Thursday" onclick="setFilter('day','Thursday',this)">Thu</button>
    <button class="filter-btn" data-group="day" data-val="Friday" onclick="setFilter('day','Friday',this)">Fri</button>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Type</span>
    <button class="filter-btn active" data-group="type" data-val="All" onclick="setFilter('type','All',this)">All</button>
    <button class="filter-btn" data-group="type" data-val="Orientation" onclick="setFilter('type','Orientation',this)">Orientation</button>
    <button class="filter-btn" data-group="type" data-val="Foundations of therapy" onclick="setFilter('type','Foundations of therapy',this)">Foundations</button>
    <button class="filter-btn" data-group="type" data-val="PTSD" onclick="setFilter('type','PTSD',this)">PTSD</button>
    <button class="filter-btn" data-group="type" data-val="Depression" onclick="setFilter('type','Depression',this)">Depression</button>
    <button class="filter-btn" data-group="type" data-val="Anxiety" onclick="setFilter('type','Anxiety',this)">Anxiety</button>
    <button class="filter-btn" data-group="type" data-val="Anger" onclick="setFilter('type','Anger',this)">Anger</button>
    <button class="filter-btn" data-group="type" data-val="Other" onclick="setFilter('type','Other',this)">Other</button>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Modality</span>
    <button class="filter-btn active" data-group="modality" data-val="All" onclick="setFilter('modality','All',this)">All</button>
    <button class="filter-btn virtual" data-group="modality" data-val="Virtual" onclick="setFilter('modality','Virtual',this)"><i class="ti ti-video" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Virtual</button>
    <button class="filter-btn inperson" data-group="modality" data-val="In-Person" onclick="setFilter('modality','In-Person',this)"><i class="ti ti-building" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>In-Person</button>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Program</span>
    <button class="filter-btn active" data-group="grouplocation" data-val="All" onclick="setFilter('grouplocation','All',this)">All</button>
    <button class="filter-btn" data-group="grouplocation" data-val="BHIP" onclick="setFilter('grouplocation','BHIP',this)">BHIP</button>
    <button class="filter-btn" data-group="grouplocation" data-val="PCMH" onclick="setFilter('grouplocation','PCMH',this)">PCMH</button>
    <button class="filter-btn" data-group="grouplocation" data-val="SPREV" onclick="setFilter('grouplocation','SPREV',this)">SPREV</button>
    <button class="filter-btn" data-group="grouplocation" data-val="Health" onclick="setFilter('grouplocation','Health',this)">Health</button>
    <button class="filter-btn" data-group="grouplocation" data-val="Peer" onclick="setFilter('grouplocation','Peer',this)">Peer</button>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Status</span>
    <button class="filter-btn active" data-group="status" data-val="All" onclick="setFilter('status','All',this)">All</button>
    <button class="filter-btn" data-group="status" data-val="Active" onclick="setFilter('status','Active',this)"><i class="ti ti-circle-check" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Active</button>
    <button class="filter-btn" data-group="status" data-val="Inactive" onclick="setFilter('status','Inactive',this)"><i class="ti ti-circle-x" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Inactive</button>
    <button class="filter-btn" data-group="status" data-val="Full" onclick="setFilter('status','Full',this)"><i class="ti ti-lock" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Full</button>
  </div>
  <div class="filter-panel-footer">
    <button class="clear-all-btn" onclick="clearAllFilters()"><i class="ti ti-x" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>Clear all filters</button>
  </div>
</div>

<div class="summary-bar" id="summaryBar"></div>
<p class="hint"><i class="ti ti-hand-click"></i> Click a group to expand its full details.</p>
<div class="group-list" id="groupList"></div>

<button class="add-btn" onclick="openModal()"><i class="ti ti-plus"></i> Add Group</button>
<button class="export-btn" onclick="exportHTML()"><i class="ti ti-download"></i> Export Directory</button>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="modalTitle"><i class="ti ti-clipboard-plus" style="margin-right:0.4rem;vertical-align:-2px"></i>Add New Group</h2>
    <div class="form-grid">
      <div class="form-group full"><label>Name of Group *</label><input id="f-name" placeholder="e.g. PTSD Cognitive Processing Therapy"></div>
      <div class="form-group"><label>Day Group Meets *</label>
        <select id="f-day"><option value="">Select day…</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select>
      </div>
      <div class="form-group"><label>Time Group Meets *</label><input id="f-time" placeholder="e.g. 10:00 – 11:30 AM"></div>
      <div class="form-group"><label>Location / Room</label><input id="f-location" placeholder="e.g. Room 2B-105"></div>
      <div class="form-group"><label>Wing of Location</label><input id="f-wing" placeholder="e.g. Building 3, East Wing"></div>
      <div class="form-group"><label># of Sessions</label><input id="f-sessions" type="number" min="0" placeholder="0 = Ongoing"></div>
      <div class="form-group"><label>Next Start Date</label><input id="f-nextstart" type="text" placeholder="e.g. 2026-08-31 or TBD"></div>
      <div class="form-group"><label>Following Start Date</label>
        <div style="display:flex;gap:0.4rem;align-items:center">
          <input id="f-followstart" type="text" style="flex:1" placeholder="e.g. 2026-11-01 or TBD">
        </div>
      </div>
      <div class="form-group"><label>Max # of Patients</label><input id="f-maxpts" type="number" min="1" placeholder="e.g. 10"></div>
      <div class="form-group"><label>Group Facilitator</label><input id="f-facilitator" placeholder="Name, credentials"></div>
      <div class="form-group"><label>Type of Group</label>
        <select id="f-type"><option value="">Select type…</option><option>Orientation</option><option>Foundations of therapy</option><option>PTSD</option><option>Depression</option><option>Anxiety</option><option>Anger</option><option>Other</option></select>
      </div>
      <div class="form-group"><label>Modality</label>
        <select id="f-modality"><option value="">Select…</option><option>In-Person</option><option>Virtual</option></select>
      </div>
      <div class="form-group"><label>Clinic Name</label><input id="f-clinic" placeholder="e.g. Mental Health Clinic"></div>
      <div class="form-group"><label>Program</label>
        <select id="f-grouplocation"><option value="">Select program…</option><option>BHIP</option><option>PCMH</option><option>SPREV</option><option>Health</option><option>Peer</option></select>
      </div>
      <div class="form-group"><label>Referral Method</label>
        <select id="f-referral"><option value="">Select…</option><option>Consult</option><option>Self-referral</option><option>PCMM</option><option>Provider referral</option></select>
      </div>
      <div class="form-group full"><label>Eligibility Criteria</label><textarea id="f-eligibility" placeholder="Describe who qualifies for this group…"></textarea></div>
    </div>
    <div class="modal-footer">

  {"name":"Women's STAIR (Skills Training in Affective and Interpersonal Regulation)","day":"Monday","time":"10:30-12:00","location":"VVC","wing":"VVC","sessions":12,"nextStart":"2026-08-31","followStart":"TBD","recurring":false,"recurringNote":"","maxPts":10,"facilitator":"C. Allen","type":"PTSD","modality":"Virtual","clinic":"LOM NOR VVC MH BHIP1 STAIR GP","grouplocation":"BHIP","referral":"Consult","eligibility":"STAIR is 12-session, evidence-based, manualized, skills-focused treatment for individuals with PTSD symptoms that focuses on improving emotion regulation and interpersonal skills with goal of improving functioning in daily life. There is no trauma processing in group. This treatment may be helpful for those not yet ready to begin a trauma-focused EBP such as CPT or PE. Out of session skills practice is assigned each week. After confirming with Veteran that they can attend at the date and time and after reviewing eligibility criteria, place group consult. Please write in consult \"DO NOT SEND VVC LINK.\"","id":"seed-40","lastUpdated":"2026-07-30 09:00 AM"},
  {"name":"ROSE Group (Perinatal)","day":"Thursday","time":"08:30-10:30","location":"VVC","wing":"VVC","sessions":6,"nextStart":"2026-07-23","followStart":"2026-09-03","recurring":false,"recurringNote":"","maxPts":8,"facilitator":"A. Hassan","type":"Other","modality":"Virtual","clinic":"Lom Nor Vvc Mh Women Champ Gp","grouplocation":"BHIP","referral":"Provider referral","eligibility":"The ROSE Program (Reach Out, Stay Strong, Essentials for mothers of newborns) is an evidence-based program that has been shown to reduce cases of postpartum depression by half among low-income women in a series of randomized control trials. The ROSE Program includes 4  prenatal sessions and 2 PT sessions with our pelvic floor therapist. Topics include psychoeducation on postpartum depression, managing the transition to motherhood, managing relationships, self-care, assertiveness and goal-setting, and a review session. No depression diagnosis or BHIP intake needed. Veteran should be pregnant or in postpartum period (within 1 year).","id":"seed-41","lastUpdated":"2026-07-30 09:00 AM"},

  {"name":"Increasing the Inner Self – Part 1 (Self-Esteem)","day":"Thursday","time":"10:30-12:00","location":"VVC","wing":"VVC","sessions":8,"nextStart":"2026-07-30","followStart":"2027-01-07","recurring":false,"recurringNote":"","maxPts":12,"facilitator":"L. Johnson","type":"Other","modality":"Virtual","clinic":"LOM ACC VVC MH BHIP3 MSW 3 GRP","grouplocation":"BHIP","referral":"Consult","eligibility":"Focuses on building one’s self-esteem and feeling empowered and assertive. This group is packed with exercises within each session. Participants will be asked to actively participate during the discussion and exercises as a means of behavior modification that includes speaking up for oneself, shifting one’s mindset, and increasing overall self-empowerment. Veterans will learn action steps to build one’s self-esteem. Between session practice assignments will entail utilizing knowledge and skills learned in session to increase behavioral changes and motivations for improvement of overall functioning. Participants will complete a series of assessments/questionnaires as a means of bringing their true needs to their awareness. All Veterans may benefit from this treatment, especially those with  depressive or Eating Disorders, or anxiety disorders, high-risk patients, those impacted by IPV and/or MST, and those observably having a lack of boundaries in their life and within relationships.\n\nNot for Narcissistic PD. Beneficial for Veterans with depressive disorder, IPV impact, SUD, or low self-esteem/lack of boundaries.","id":"seed-45","full":true,"lastUpdated":"2026-07-30 09:00 AM"},
  {"name":"Increasing the Inner Self – Part 2 (Boundary Setting)","day":"Thursday","time":"10:30-12:00","location":"VVC","wing":"VVC","sessions":9,"nextStart":"2026-10-08","followStart":"TBD","recurring":false,"recurringNote":"","maxPts":12,"facilitator":"L. Johnson","type":"Other","modality":"Virtual","clinic":"LOM ACC VVC MH BHIP3 MSW 3 GRP","grouplocation":"BHIP","referral":"Consult","eligibility":"Group that focuses on building and utilizing boundary setting skills with oneself and others. The group is a follow up to Part 1 that focuses on building one's self-esteem. Although it is encouraged Veterans complete Part 1 first, it is not required. This group is packed with exercises within each session. Participants will be asked to actively participate during the discussion and exercises as a means of behavior modification that includes verbally setting healthy and balanced boundaries with people in their life as well as setting boundaries for themselves. Another objective of the group is to help Veterans increase trust in others by reflecting on situations where boundary setting was used and respected. Despite the need to participate in the group to obtain the most out of the treatment, participation is still voluntary. Between session practice assignments will entail utilizing knowledge and skills learned in session to increase behavioral changes, empower and motivate the Veteran for improvement of their overall functioning. Participants will complete an assessment/questionnaire as a means of monitoring improvement. \n\nAll Veterans may benefit from this treatment, especially those with  depressive, anxiety, or PTSD symptoms, those impacted by IPV and/or MST or Eating Disorders, and those observably having a lack of boundaries in their life and within relationships.\n\nNot for Narcissistic PD. Part 1 encouraged but not required.","id":"seed-46","full":false,"lastUpdated":"2026-07-30 09:00 AM"},

let groups = DEFAULT_GROUPS.map(g => Object.assign({}, g));
let filters = { day:'All', type:'All', modality:'All', grouplocation:'All', status:'All' };
let searchTerm = '', expandedIdx = null, editingIdx = null;
let lastChangedTime = null;
let sortBy = 'default';

function nowStamp() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h=12;
  const min = String(d.getMinutes()).padStart(2,'0');
  return yyyy+'-'+mm+'-'+dd+' '+String(h).padStart(2,'0')+':'+min+' '+ampm;
}

function parseLastUpdated(s) {
  if(!s) return 0;
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(m) {
    let h = parseInt(m[4]);
    const min = parseInt(m[5]);
    const ampm = m[6].toUpperCase();
    if(ampm==='PM' && h!==12) h+=12;
    if(ampm==='AM' && h===12) h=0;
    return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]), h, min).getTime();
  }
  const d2 = new Date(s);
  return isNaN(d2.getTime()) ? 0 : d2.getTime();
}

function stampChange() {
  lastChangedTime = new Date();
  const el = document.getElementById('lastChangeVal');
  if(el) el.textContent = lastChangedTime.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
}

function referralClass(r) {
  if(r === 'Self-referral') return 'referral-self';
  if(r === 'PCMM') return 'referral-pcmm';
  return 'referral-consult';
}

function formatDate(d) {
  if(!d) return 'Ongoing';
  if(typeof d !== 'string') return d;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  const p = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(p[1])-1] + ' ' + parseInt(p[2]) + ', ' + p[0];
}

function getFiltered() {
  return groups.map((g,i) => ({g,i})).filter(({g}) => {
    const dayOk = filters.day === 'All' || g.day === filters.day;
    const typeOk = filters.type === 'All' || g.type === filters.type;
    const modOk = filters.modality === 'All' || g.modality === filters.modality;
    const locOk = filters.grouplocation === 'All' || g.grouplocation === filters.grouplocation;
    const statOk = filters.status === 'All' ||
      (filters.status === 'Active' && !g.inactive && !g.full) ||
      (filters.status === 'Inactive' && g.inactive) ||
      (filters.status === 'Full' && g.full && !g.inactive);
    const q = searchTerm.toLowerCase();
    const searchOk = !q || (g.name||'').toLowerCase().includes(q) || (g.facilitator||'').toLowerCase().includes(q) || (g.clinic||'').toLowerCase().includes(q);
    return dayOk && typeOk && modOk && locOk && statOk && searchOk;
  });
}

function sortFiltered(arr) {
  const sorted = arr.slice();
  if(sortBy === 'updated-desc') {
    sorted.sort((a,b) => parseLastUpdated(b.g.lastUpdated) - parseLastUpdated(a.g.lastUpdated));
  } else if(sortBy === 'updated-asc') {
    sorted.sort((a,b) => parseLastUpdated(a.g.lastUpdated) - parseLastUpdated(b.g.lastUpdated));
  } else if(sortBy === 'name') {
    sorted.sort((a,b) => (a.g.name||'').localeCompare(b.g.name||''));
  }
  return sorted;
}

function setSortBy(val) { sortBy = val; expandedIdx = null; renderCards(); }

    html += '<div class="detail-footer">';
    html += '<span class="referral-pill '+referralClass(g.referral)+'"><i class="ti ti-send" style="font-size:11px;margin-right:3px;vertical-align:-1px"></i>'+(g.referral||'See clinic')+'</span>';
    html += '<div class="footer-actions">';
    html += '<button class="icon-btn edit" onclick="event.stopPropagation();openEdit('+i+')" title="Edit"><i class="ti ti-pencil"></i> Edit</button>';
    if(!g.inactive) {
      html += '<button class="icon-btn inactivate" onclick="event.stopPropagation();toggleInactive('+i+')" title="Mark inactive"><i class="ti ti-circle-x"></i> Inactivate</button>';
      if(!g.full) html += '<button class="icon-btn full-btn" onclick="event.stopPropagation();toggleFull('+i+')" title="Mark full"><i class="ti ti-lock"></i> Mark Full</button>';
      else html += '<button class="icon-btn unfull-btn" onclick="event.stopPropagation();toggleFull('+i+')" title="Mark open"><i class="ti ti-lock-open"></i> Mark Open</button>';
    } else {
      html += '<button class="icon-btn activate" onclick="event.stopPropagation();toggleInactive('+i+')" title="Mark active"><i class="ti ti-circle-check"></i> Activate</button>';
    }
    html += '<button class="icon-btn del" onclick="event.stopPropagation();deleteGroup('+i+')" title="Delete"><i class="ti ti-trash"></i> Delete</button>';
    html += '</div></div></div></div>';
  });
  list.innerHTML = html;
  document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
}

function toggleInactive(idx) { groups[idx].inactive = !groups[idx].inactive; if(groups[idx].inactive) groups[idx].full = false; groups[idx].lastUpdated = nowStamp(); stampChange(); renderCards(); }
function toggleFull(idx) { groups[idx].full = !groups[idx].full; groups[idx].lastUpdated = nowStamp(); stampChange(); renderCards(); }

function toggleCard(i) {
  expandedIdx = expandedIdx === i ? null : i;
  renderCards();
  if(expandedIdx !== null) setTimeout(()=>{ const el=document.getElementById('card-'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); },50);
}

function toggleFilterPanel() {
  const panel = document.getElementById('filterPanel');
  panel.classList.toggle('open');
  const btn = document.getElementById('filterToggleBtn');
  const isOpen = panel.classList.contains('open');
  btn.innerHTML = isOpen
    ? '<i class="ti ti-x"></i> Close Filters'
    : '<i class="ti ti-adjustments-horizontal"></i> Filter &amp; Sort';
}

const GROUP_LABELS = { day:'Day', type:'Type', modality:'Modality', grouplocation:'Program', status:'Status' };

function updateChips() {
  const wrap = document.getElementById('activeChips');
  const btn = document.getElementById('filterToggleBtn');
  const active = Object.entries(filters).filter(([,v]) => v !== 'All');
  wrap.innerHTML = active.map(([k,v]) =>
    '<span class="active-chip">'+GROUP_LABELS[k]+': '+v+'<button onclick="clearFilter(\''+k+'\')" title="Remove filter">×</button></span>'
  ).join('');
  btn.classList.toggle('has-active', active.length > 0);
}

function clearFilter(group) {
  filters[group] = 'All';
  document.querySelectorAll('.filter-btn[data-group="'+group+'"]').forEach(b => {
    b.classList.toggle('active', b.dataset.val === 'All');
  });
  expandedIdx = null;
  updateChips();
  renderCards();
}

function clearAllFilters() {
  Object.keys(filters).forEach(k => {
    filters[k] = 'All';
    document.querySelectorAll('.filter-btn[data-group="'+k+'"]').forEach(b => {
      b.classList.toggle('active', b.dataset.val === 'All');
    });
  });
  expandedIdx = null;
  updateChips();
  renderCards();
}

function setFilter(group, val, btn) {
  filters[group] = val;
  expandedIdx = null;
  document.querySelectorAll('.filter-btn[data-group="'+group+'"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateChips();
  renderCards();
}

function searchGroups(val) { searchTerm = val; expandedIdx = null; renderCards(); }

function clearForm() {
  FIELDS.forEach(id => {
    const el = document.getElementById(id); if(!el) return;
    el.value='';
  });
}

function openModal() {
  editingIdx=null; clearForm();
  document.getElementById('modalTitle').innerHTML='<i class="ti ti-clipboard-plus" style="margin-right:0.4rem;vertical-align:-2px"></i>Add New Group';
  document.getElementById('modalSaveBtn').textContent='Save Group';
  document.getElementById('modalOverlay').classList.add('open');
}

function openEdit(idx) {
  editingIdx=idx;
  const g=groups[idx];
  const map={'f-name':'name','f-day':'day','f-time':'time','f-location':'location','f-wing':'wing','f-sessions':'sessions','f-nextstart':'nextStart','f-followstart':'followStart','f-maxpts':'maxPts','f-facilitator':'facilitator','f-type':'type','f-modality':'modality','f-clinic':'clinic','f-grouplocation':'grouplocation','f-referral':'referral','f-eligibility':'eligibility'};
  Object.keys(map).forEach(fid => {
    const el=document.getElementById(fid); if(!el) return;
    const val=g[map[fid]]!=null?g[map[fid]]:'';
    el.value=val;
  });
  document.getElementById('modalTitle').innerHTML='<i class="ti ti-pencil" style="margin-right:0.4rem;vertical-align:-2px"></i>Edit Group';
  document.getElementById('modalSaveBtn').textContent='Save Changes';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); editingIdx=null; }
function closeModalOutside(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }

function deleteGroup(idx){
  if(confirm('Remove "'+groups[idx].name+'" from the directory?')){
    groups.splice(idx,1); expandedIdx=null; stampChange(); renderCards();
  }
}

function saveGroup(){
  const name=document.getElementById('f-name').value.trim();
  const day=document.getElementById('f-day').value;
  const time=document.getElementById('f-time').value.trim();
  if(!name||!day||!time){alert('Please fill in at least the group name, day, and time.');return;}
  const entry={
    name,day,time,
    location:document.getElementById('f-location').value.trim(),
    wing:document.getElementById('f-wing').value.trim(),
    sessions:parseInt(document.getElementById('f-sessions').value)||0,
    nextStart:document.getElementById('f-nextstart').value.trim(),
    followStart:document.getElementById('f-followstart').value.trim(),
    maxPts:parseInt(document.getElementById('f-maxpts').value)||'',
    facilitator:document.getElementById('f-facilitator').value.trim(),
    type:document.getElementById('f-type').value,
    modality:document.getElementById('f-modality').value,
    clinic:document.getElementById('f-clinic').value.trim(),
    grouplocation:document.getElementById('f-grouplocation').value,
    referral:document.getElementById('f-referral').value,
    eligibility:document.getElementById('f-eligibility').value.trim(),
    lastUpdated: nowStamp()
  };
  if(editingIdx!==null){
    entry.id = groups[editingIdx].id;
    entry.inactive=groups[editingIdx].inactive;
    entry.full=groups[editingIdx].full;
    groups[editingIdx]=entry;
  } else {
    entry.id = 'g-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
    groups.push(entry);
  }
  stampChange(); clearForm(); closeModal(); renderCards();
}

function exportHTML(){
  const groupsJSON=JSON.stringify(groups,null,2);
  const source=document.documentElement.outerHTML;
  const updated=source.replace(/const DEFAULT_GROUPS = \[[\s\S]*?\];/, 'const DEFAULT_GROUPS = '+groupsJSON+';');
  const blob=new Blob([updated],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='VA-Group-Directory.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

renderCards();
</script>
</body>
</html>
